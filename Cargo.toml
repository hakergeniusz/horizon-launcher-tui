[package]
name = "horizon-launcher-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal UI and CLI port of the Horizon game launcher's native-mods workflows"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
